<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Opportunity Action | Universal Marketplace</title>
  <style>
    :root {
      --primary: #0F172A;
      --accent: #2563EB;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
      --success: #059669;
      --success-bg: #ECFDF5;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-card: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; align-items: center; min-height: 90vh; -webkit-font-smoothing: antialiased; line-height: 1.5; }

    /* Action Container Card */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 480px; width: 100%; padding: clamp(24px, 5vw, 36px); text-align: center; box-shadow: var(--shadow-card); }

    .brand-mark { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    h1 { font-size: clamp(20px, 4vw, 24px); font-weight: 800; color: var(--primary); margin-bottom: 12px; letter-spacing: -0.4px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }

    /* Lead Meta Box */
    .lead-box { background: #F8FAFC; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 24px; font-size: 13px; font-weight: 600; color: var(--primary); }

    /* Interactive Buttons */
    .btn-action { display: block; width: 100%; padding: 14px 24px; font-size: 16px; font-weight: 700; border-radius: var(--radius-sm); border: none; cursor: pointer; min-height: 48px; text-decoration: none; color: #fff; transition: opacity 0.15s; }
    .btn-action:hover { opacity: 0.95; }
    .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-claim { background: var(--success); }
    .btn-decline { background: #64748B; }

    /* Anti-Scanner Notice */
    .scanner-note { font-size: 12px; color: #94A3B8; margin-top: 14px; line-height: 1.4; }

    /* Dynamic Result Panels */
    .result-box { padding: 20px 16px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.5; margin-top: 16px; display: none; text-align: left; }
    .result-icon { font-size: 32px; margin-bottom: 8px; }
    .result-title { font-weight: 800; font-size: 16px; margin-bottom: 6px; }

    /* Escrow Contact Details Display */
    .contact-card { background: #FFFFFF; border: 1px solid #A7F3D0; border-radius: var(--radius-sm); padding: 14px; margin-top: 14px; font-size: 13px; }
    .contact-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #ECFDF5; }
    .contact-row:last-child { border-bottom: none; }
    .contact-label { color: #047857; font-weight: 600; }
    .contact-value { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-mark">Universal Marketplace Operations</div>
    <h1 id="actionTitle">Confirm Lead Response</h1>
    
    <div class="lead-box">
      Lead Opportunity: <span style="color:var(--accent);">#<?= leadId ?></span>
    </div>

    <p id="actionSub">
      <?= decision === 'INTERESTED' ? 'You are about to accept this customer connection. If capacity is available, 1 lead credit will be deducted.' : 'You are about to decline this opportunity. The request will automatically be offered to the next ranked professional.' ?>
    </p>

    <!-- Two-Phase Anti-Scanner Intent Confirmation Gate -->
    <div id="confirmPanel">
      <button type="button" 
              class="btn-action <?= decision === 'INTERESTED' ? 'btn-claim' : 'btn-decline' ?>" 
              id="confirmBtn" 
              onclick="submitDecision()">
        CONFIRM: <?= decision === 'INTERESTED' ? 'CLAIM LEAD NOW' : 'PASS ON THIS OPPORTUNITY' ?>
      </button>
      <div class="scanner-note">
        This confirmation step prevents automated corporate email security scanners from prematurely claiming leads on your behalf.
      </div>
    </div>

    <!-- Live Execution Status / Escrow Reveal Panel -->
    <div id="resultBox" class="result-box">
      <div class="result-icon" id="resIcon"></div>
      <div class="result-title" id="resTitle"></div>
      <div id="resMessage"></div>
      <div id="unlockedPiiContainer"></div>
    </div>
  </div>

  <script>
    var decision = "<?= decision ?>";
    var leadId = "<?= leadId ?>";
    var providerId = "<?= providerId ?>";
    var timestamp = "<?= timestamp ?>";
    var signature = "<?= signature ?>";

    function submitDecision() {
      var btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.innerText = 'Processing Transaction...';

      google.script.run
        .withSuccessHandler(function (res) {
          document.getElementById('confirmPanel').style.display = 'none';
          document.getElementById('actionSub').style.display = 'none';
          var rBox = document.getElementById('resultBox');
          var rIcon = document.getElementById('resIcon');
          var rTitle = document.getElementById('resTitle');
          var rMessage = document.getElementById('resMessage');
          rBox.style.display = 'block';

          if (res && res.success) {
            document.getElementById('actionTitle').innerText = 'Response Recorded';

            if (res.code === 'ACCEPTED_SUCCESS') {
              rBox.style.background = '#ECFDF5';
              rBox.style.color = '#065F46';
              rBox.style.border = '1px solid #A7F3D0';
              rIcon.innerHTML = '&#9989;';
              rTitle.innerText = 'Lead Successfully Claimed!';
              rMessage.innerHTML = res.message + '<br><br>Full contact details have been dispatched to your registered email address.';
            } else {
              // Declined confirmed
              rBox.style.background = '#F8FAFC';
              rBox.style.color = '#334155';
              rBox.style.border = '1px solid var(--border)';
              rIcon.innerHTML = '&#10004;';
              rTitle.innerText = 'Opportunity Passed';
              rMessage.innerText = res.message;
            }
          } else {
            document.getElementById('actionTitle').innerText = 'Opportunity Notice';
            rBox.style.background = '#FEF2F2';
            rBox.style.color = '#991B1B';
            rBox.style.border = '1px solid #FECACA';
            rIcon.innerHTML = '&#9888;';
            rTitle.innerText = 'Action Notice';
            rMessage.innerText = res ? res.message : 'Unable to complete action. The link may have expired or lead capacity was reached.';
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerText = 'CONFIRM RESPONSE';
          alert('Communication error: ' + err.message);
        })
        .executeProviderLeadActionRpc(decision, leadId, providerId, timestamp, signature);
    }
  </script>
</body>
</html>
